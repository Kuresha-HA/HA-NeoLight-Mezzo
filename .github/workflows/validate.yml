name: Validate integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest aiohttp cryptography
      - run: python -m compileall -q custom_components tools
      - run: python -m pytest -q
