name: Publish HACS release

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/neolight_mezzo/manifest.json"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-hacs-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create version tag and GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('custom_components/neolight_mezzo/manifest.json', 'utf8'));
            const version = manifest.version;
            const versionParts = String(version || '').split('.');
            if (versionParts.length !== 3 || versionParts.some(part => !part || [...part].some(char => char < '0' || char > '9'))) {
              core.setFailed('manifest.json must contain a valid semantic version.');
              return;
            }

            const tag = 'v' + version;
            const { owner, repo } = context.repo;

            let existing;
            try {
              existing = await github.rest.git.getRef({ owner, repo, ref: 'tags/' + tag });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (existing) {
              core.info('Tag ' + tag + ' already exists; nothing to publish.');
              return;
            }

            await github.rest.git.createRef({
              owner,
              repo,
              ref: 'refs/tags/' + tag,
              sha: context.sha
            });

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: 'NeoLight MEZZO ' + version,
              body: [
                'Experimental release of the NeoLight MEZZO Home Assistant integration.',
                '',
                'Install through HACS as a custom integration repository.',
                'The local mobile_profile.json file is intentionally not included; keep it beside the integration files and never publish it.'
              ].join('\\n'),
              draft: false,
              prerelease: true,
              generate_release_notes: true
            });

            core.info('Published prerelease ' + tag);
